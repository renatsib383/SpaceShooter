name: Deploy to GitHub Pages

on:
  push:
    # The repo's default branch today, plus main for when the project moves there.
    branches: [claude/ku-42d8pz, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a half-applied Pages
# deployment would leave the live site broken.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gate the deploy on the checks. They need no browser and take seconds,
      # so there is no reason to publish a build that fails them.
      - run: npm run typecheck
      - run: npm test

      - run: npm run build

      # Pages must already be enabled with "GitHub Actions" as its source, in
      # Settings > Pages. This step cannot turn it on: GITHUB_TOKEN has no
      # administration permission, so the create-site call is refused.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
